<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Iniciar sesión · Panel del canal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="acceso">
  <div class="tarjeta">
    <div class="pila" style="gap: 6px">
      <h1>Panel del canal</h1>
      <p class="suave">Inicia sesión para administrar tus videos.</p>
    </div>
    {% if error %}<p class="aviso error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login" class="pila">
      <label class="campo">Correo
        <input type="email" name="email" autocomplete="username" required>
      </label>
      <label class="campo">Contraseña
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button class="boton primario" type="submit">Entrar</button>
    </form>
  </div>
</main>
</body>
</html>
