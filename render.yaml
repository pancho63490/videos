# Blueprint de Render: crea el servicio web y la base de datos PostgreSQL.
# En Render: New > Blueprint > elige este repositorio.
services:
  - type: web
    name: canal-curiosidades
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: canal-curiosidades-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # La cuenta de administrador y la clave del modelo de IA se capturan
      # desde el propio panel, en la configuración inicial y la Guía de inicio.

databases:
  - name: canal-curiosidades-db
    plan: free
